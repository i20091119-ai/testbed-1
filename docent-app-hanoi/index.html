<title>A-19 대형 하노이탑</title>
<script>
/* =========================================================
   전시물 내용 — 다른 전시물로 바꿀 때는 이 객체만 고치면 됩니다.
   ========================================================= */
const EXHIBIT = {
  code: "A-19",
  name: "대형 하노이탑",
  location: "어드벤처관 1층",
  museum: "경남수학문화관",

  steps: [
    "원판은 한 번에 1개, 맨 위에 있는 것만 옮겨요.",
    "큰 원판은 작은 원판 위에 올릴 수 없어요.",
    "옆 상자에서 원판을 꺼내 1개, 2개, 3개… 큰 것부터 한 기둥에 쌓고, 다른 기둥으로 모두 옮기며 몇 번 옮겼는지 세어 봐요."
  ],

  counter: {
    title: "몇 번 옮겼을까?",
    hint: "원판을 하나 옮길 때마다 +1을 눌러요."
  },

  levels: {
    low: {
      label: "저학년",
      html: `
        <p>원판 <b>1개</b>는 <b>1번</b>, <b>2개</b>는 <b>3번</b>, <b>3개</b>는 <b>7번</b>이면 다 옮길 수 있어요.</p>
        <p>1, 3, 7… 숫자가 커지는 데 <b>규칙</b>이 있어요.<br>앞의 수를 <b>두 번 더하고 1을 더하면</b> 다음 수가 돼요.</p>
        <div class="calc">1 + 1 + 1 = <b>3</b><br>3 + 3 + 1 = <b>7</b></div>
        <p>이렇게 숫자가 늘어나는 규칙을 찾는 것도 수학이에요.</p>`
    },
    high: {
      label: "고학년",
      html: `
        <p>원판 <b>n개</b>를 옮기는 방법</p>
        <ol class="plan">
          <li>위의 <b>n−1개</b>를 남는 기둥으로 옮긴다</li>
          <li>가장 큰 원판 <b>1개</b>를 목표 기둥으로 옮긴다</li>
          <li><b>n−1개</b>를 다시 그 위로 옮긴다</li>
        </ol>
        <p>그래서 <b>(n개 횟수) = 2 × (n−1개 횟수) + 1</b></p>
        <div class="seq"><span>1</span><span>3</span><span>7</span><span>15</span><span>31</span><span>…</span></div>
        <p>각 수에 1을 더하면 2, 4, 8, 16, 32 — 2를 거듭 곱한 수예요.<br>그래서 최소 횟수는 <b class="big">2ⁿ − 1</b></p>
        <details class="more">
          <summary>더 알아보기 (중·고등)</summary>
          <p>"n−1개일 때 맞으면 n개일 때도 맞다"를 보이고, 1개일 때 맞는 것을 확인하면 모든 n에서 맞다고 할 수 있어요. 이런 증명 방법을 <b>수학적 귀납법</b>이라고 해요. (고등 수학Ⅰ)</p>
        </details>`
    }
  },

  quiz: {
    question: "원판이 <b>4개</b>면 최소 몇 번 옮겨야 할까?",
    options: ["8번", "15번", "16번"],
    answerIndex: 1,
    tryText: "골랐나요? 이제 파랑·노랑·초록·주황 원판 4개를 쌓고 직접 옮기며 횟수를 세어 봐요.",
    revealButton: "직접 해 보고 답 보기",
    explain: "3개를 옮기고(<b>7번</b>), 가장 큰 원판을 옮기고(<b>1번</b>), 다시 3개를 그 위로(<b>7번</b>).<br><b>7 + 1 + 7 = 15</b>"
  },

  faq: [
    {
      q: "하노이탑은 누가 만들었어요?",
      a: "1883년 프랑스 수학자 에두아르 뤼카가 만든 퍼즐이에요. 원판 64개를 다 옮기면 세상이 끝난다는 이야기도 함께 소개했어요."
    },
    {
      q: "64개를 옮기면 얼마나 걸려요?",
      a: "최소 2⁶⁴ − 1번, 약 1,800경 번이에요. 1초에 1번씩 쉬지 않고 옮겨도 약 5,800억 년이 걸려요."
    },
    {
      q: "기둥이 4개면 더 빨라져요?",
      a: "원판이 3개 이상이면 빨라져요. 원판 3개는 기둥 3개일 때 7번, 기둥 4개일 때 5번이면 돼요. 기둥이 4개일 때 최소 횟수를 구하는 방법은 오랫동안 풀리지 않던 문제였어요."
    }
  ]
};
</script>
<style>
  /* 색은 실물에서: 나무 받침, 검은 쿠션·기둥, 색 원판 */
  :root {
    --paper: #f7f3ec;
    --surface: #ffffff;
    --ink: #1c1f24;
    --muted: #585e68;
    --rule: #e4dccd;
    --wood: #c98d55;
    --wood-dark: #a86f3c;
    --cushion: #1f2227;
    --cushion-ink: #f4efe6;
    --cushion-muted: #b9b2a6;
    --disc-orange: #d9581b;
    --disc-blue: #2f6fd6;
    --disc-green: #5aa83a;
    --disc-yellow: #f4c430;
    --disc-lime: #a6cf45;
    --disc-mint: #b9dccb;
    --good: #2b7a46;
    --good-tint: #e6f3ea;
    --hint-tint: #fdf3dc;
    --focus: #d9581b;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    font-size: 18px;
    line-height: 1.6;
    word-break: keep-all;
    overflow-wrap: break-word;
    -webkit-tap-highlight-color: transparent;
  }
  ::selection { background: var(--disc-yellow); color: var(--ink); }
  main { max-width: 480px; margin: 0 auto; padding: 0 20px 28px; }
  b, strong { font-weight: 800; }
  p { margin: 0 0 12px; }
  p:last-child { margin-bottom: 0; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; min-height: 48px; }
  button:focus-visible, summary:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 12px; }

  /* 머리 */
  header.top { padding: 14px 0 6px; display: flex; align-items: flex-end; gap: 16px; }
  header.top .text { flex: 1; min-width: 0; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 6px; }
  .code {
    font-size: 17px; font-weight: 800; letter-spacing: .03em;
    background: var(--cushion); color: var(--cushion-ink);
    padding: 1px 10px; border-radius: 8px; font-variant-numeric: tabular-nums;
  }
  .loc { display: inline-flex; align-items: center; gap: 4px; font-size: 17px; font-weight: 700; color: var(--muted); }
  .loc svg { width: 18px; height: 18px; flex: none; }
  h1 { margin: 0; font-size: 34px; line-height: 1.2; font-weight: 900; letter-spacing: -0.02em; }
  .mark { width: 64px; height: 56px; flex: none; }

  section { padding-top: 26px; }
  section + section { margin-top: 10px; border-top: 1px solid var(--rule); }
  h2 { margin: 0 0 14px; font-size: 23px; line-height: 1.3; font-weight: 900; letter-spacing: -0.01em; }

  /* [1] 사용 방법 */
  ol.steps { list-style: none; margin: 0; padding: 0; }
  ol.steps li { display: flex; gap: 12px; align-items: flex-start; padding: 6px 0; }
  ol.steps .n {
    flex: none; width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 17px; color: #fff; margin-top: -1px;
    font-variant-numeric: tabular-nums;
  }
  ol.steps li:nth-child(1) .n { background: var(--disc-orange); }
  ol.steps li:nth-child(2) .n { background: var(--disc-blue); }
  ol.steps li:nth-child(3) .n { background: var(--disc-green); }
  .diagram { display: block; width: 100%; height: auto; margin-top: 14px; }

  /* [2] 횟수 세기 — 검은 쿠션 받침 */
  .counter {
    background: var(--cushion); color: var(--cushion-ink);
    border-radius: 22px; padding: 18px;
    box-shadow: 0 10px 24px -12px rgba(31,34,39,.55);
    display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: center;
  }
  .count { text-align: center; }
  .count .num {
    display: block; font-size: 76px; line-height: 1; font-weight: 900;
    font-variant-numeric: tabular-nums; letter-spacing: -0.03em;
  }
  .count small { display: block; margin-top: 6px; font-size: 17px; font-weight: 700; color: var(--cushion-muted); }
  .bump { animation: bump .32s cubic-bezier(.16,1,.3,1); }
  @keyframes bump { from { transform: scale(1.18); color: var(--disc-yellow); } to { transform: scale(1); } }
  .counter .btns { display: grid; gap: 10px; }
  .btn-plus {
    min-height: 72px; border-radius: 999px;
    background: var(--disc-orange); color: #fff;
    font-size: 30px; font-weight: 900;
    box-shadow: inset 0 -5px 0 rgba(0,0,0,.18);
    transition: transform .12s ease-out;
  }
  .btn-plus:active { transform: translateY(2px) scale(.98); }
  .btn-reset {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border-radius: 999px; color: var(--cushion-ink); font-size: 17px; font-weight: 700;
    border: 1.5px solid #4a4e56;
  }
  .btn-reset svg { width: 18px; height: 18px; }
  .hint { color: var(--muted); font-size: 17px; margin-top: 12px; }

  /* [3] 수준 탭 */
  .tabs {
    display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
    background: #ece4d6; border-radius: 14px; padding: 4px; margin-bottom: 18px;
  }
  .tabs button { border-radius: 11px; font-weight: 800; color: var(--muted); transition: background .2s ease-out, color .2s ease-out; }
  .tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 2px 6px -2px rgba(31,34,39,.25); }
  .calc {
    background: var(--surface); border: 1px solid var(--rule); border-radius: 14px;
    padding: 12px 16px; margin: 0 0 12px;
    font-size: 22px; line-height: 1.7; font-variant-numeric: tabular-nums;
  }
  ol.plan { margin: 0 0 12px; padding-left: 24px; }
  ol.plan li { margin-bottom: 4px; padding-left: 2px; }
  ol.plan li::marker { font-weight: 900; color: var(--disc-blue); }
  .seq { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }
  .seq span {
    min-width: 46px; height: 40px; padding: 0 10px; border-radius: 999px;
    display: inline-flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 19px; font-variant-numeric: tabular-nums;
  }
  .seq span:nth-child(1) { background: var(--disc-lime); color: var(--ink); }
  .seq span:nth-child(2) { background: var(--disc-orange); color: #fff; }
  .seq span:nth-child(3) { background: var(--disc-blue); color: #fff; }
  .seq span:nth-child(4) { background: var(--disc-yellow); color: var(--ink); }
  .seq span:nth-child(5) { background: var(--disc-green); color: #fff; }
  .seq span:nth-child(6) { background: transparent; color: var(--muted); min-width: 0; }
  .big { font-size: 28px; font-weight: 900; color: var(--disc-orange); white-space: nowrap; }
  details.more { margin-top: 14px; border-top: 1px solid var(--rule); }
  details.more summary {
    list-style: none; min-height: 48px; display: flex; align-items: center; justify-content: space-between;
    font-weight: 800; color: var(--disc-blue); cursor: pointer;
  }
  details.more summary::-webkit-details-marker { display: none; }

  /* [4] 생각 질문 */
  .quiz-q { font-size: 22px; line-height: 1.45; font-weight: 700; margin-bottom: 14px; }
  .options { display: grid; gap: 8px; }
  .options button {
    display: flex; align-items: center; gap: 12px; text-align: left;
    min-height: 56px; padding: 8px 16px; border-radius: 14px;
    background: var(--surface); border: 2px solid var(--rule);
    font-size: 21px; font-weight: 800;
    transition: border-color .15s ease-out, background .15s ease-out;
  }
  .options .dot {
    flex: none; width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid #b8ae9c; display: flex; align-items: center; justify-content: center;
  }
  .options button[aria-pressed="true"] { border-color: var(--ink); }
  .options button[aria-pressed="true"] .dot { border-color: var(--ink); }
  .options button[aria-pressed="true"] .dot::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--ink); }
  .options button.correct { border-color: var(--good); background: var(--good-tint); color: var(--good); }
  .options button.correct .dot { border-color: var(--good); background: var(--good); }
  .options button.correct .dot::after { content: none; }
  .options .tag { margin-left: auto; font-size: 17px; }
  .options button:disabled { cursor: default; }
  .options button:disabled:not(.correct) { color: var(--muted); }
  .try { margin-top: 14px; padding: 12px 16px; background: var(--hint-tint); border-radius: 14px; }
  .reveal {
    width: 100%; margin-top: 14px; min-height: 56px; border-radius: 999px;
    background: var(--cushion); color: var(--cushion-ink); font-weight: 900; font-size: 19px;
  }
  .reveal:disabled { background: #e6dfd2; color: #6b6457; cursor: not-allowed; }
  .answer { margin-top: 14px; padding: 14px 16px; background: var(--good-tint); border-radius: 14px; animation: rise .4s cubic-bezier(.16,1,.3,1); }
  .answer .verdict { font-weight: 900; font-size: 21px; color: var(--good); margin-bottom: 6px; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  [hidden] { display: none !important; }

  /* [5] 자주 묻는 질문 */
  .faq details { border-bottom: 1px solid var(--rule); }
  .faq details:first-child { border-top: 1px solid var(--rule); }
  .faq summary {
    list-style: none; min-height: 56px; padding: 12px 0; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between; gap: 12px; font-weight: 800;
  }
  .faq summary::-webkit-details-marker { display: none; }
  .chev { width: 22px; height: 22px; flex: none; color: var(--muted); transition: transform .2s ease-out; }
  details[open] > summary .chev { transform: rotate(180deg); }
  .faq details p { padding: 0 0 16px; color: #33383f; }

  .brand { padding: 16px 0 0; }
  .brand .logo { display: block; width: 190px; max-width: 60%; height: auto; }
  footer {
    margin-top: 30px; padding: 18px 0 6px; border-top: 1px solid var(--rule);
    text-align: center; color: var(--muted); font-size: 17px; font-weight: 700;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>

      <defs>
        <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
          <path d="M0,0 L10,5 L0,10 z" fill="#d9581b"/>
        </marker>
      </defs>
      <path d="M68,30 Q160,0 250,30" fill="none" stroke="#d9581b" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 8" marker-end="url(#ah)"/>
      <text x="55" y="22" text-anchor="middle" font-size="15" font-weight="700" fill="#585e68">처음</text>
      <text x="265" y="22" text-anchor="middle" font-size="15" font-weight="700" fill="#585e68">목표</text>
      <rect x="20" y="114" width="12" height="14" fill="#a86f3c"/>
      <rect x="288" y="114" width="12" height="14" fill="#a86f3c"/>
      <rect x="8" y="104" width="304" height="12" rx="3" fill="#c98d55"/>
      <rect x="8" y="94" width="304" height="12" rx="6" fill="#1f2227"/>
      <rect x="48" y="40" width="14" height="58" rx="7" fill="#1f2227"/>
      <rect x="153" y="40" width="14" height="58" rx="7" fill="#1f2227"/>
      <rect x="258" y="40" width="14" height="58" rx="7" fill="#1f2227"/>
      <rect x="13" y="80" width="84" height="15" rx="7.5" fill="#2f6fd6"/>
      <rect x="23" y="66" width="64" height="15" rx="7.5" fill="#f4c430"/>
      <rect x="33" y="52" width="44" height="15" rx="7.5" fill="#5aa83a"/>
    </svg>
  </section>

  <section aria-labelledby="h-count">
    <h2 id="h-count"><span id="counter-title"></span></h2>
    <div class="counter">
      <div class="count" aria-live="polite"><span class="num" id="count">0</span><small>번 옮겼어요</small></div>
      <div class="btns">
        <button class="btn-plus" id="plus" aria-label="1번 더하기">+1</button>
        <button class="btn-reset" id="reset">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
          처음부터
        </button>
      </div>
    </div>
    <p class="hint" id="counter-hint"></p>
  </section>

  <section aria-labelledby="h-math">
    <h2 id="h-math">어떤 수학일까?</h2>
    <div class="tabs" role="tablist" aria-label="설명 수준">
      <button role="tab" id="tab-low" aria-controls="level-body"></button>
      <button role="tab" id="tab-high" aria-controls="level-body"></button>
    </div>
    <div id="level-body" role="tabpanel" aria-live="polite"></div>
  </section>

  <section aria-labelledby="h-quiz">
    <h2 id="h-quiz">생각 질문</h2>
    <p class="quiz-q" id="quiz-q"></p>
    <div class="options" id="options" role="group" aria-label="예측해서 하나 고르기"></div>
    <p class="try" id="try" hidden></p>
    <button class="reveal" id="reveal" disabled></button>
    <div class="answer" id="answer" hidden aria-live="polite"></div>
  </section>

  <section class="faq" aria-labelledby="h-faq">
    <h2 id="h-faq">자주 묻는 질문</h2>
    <div id="faq"></div>
  </section>

  <footer><span id="museum-name"></span></footer>
</main>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const E = EXHIBIT;
  const CHEV = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';

  /* 머리 */
  document.title = E.code + " " + E.name;
  $("code").textContent = E.code;
  $("name").textContent = E.name;
  $("loc").textContent = E.location;
  $("museum").alt = "경상남도교육청 " + E.museum;
  $("museum-name").textContent = E.museum;

  /* [1] 사용 방법 */
  $("steps").innerHTML = E.steps
    .map((s, i) => '<li><span class="n" aria-hidden="true">' + (i + 1) + "</span><span>" + s + "</span></li>")
    .join("");

  /* [2] 횟수 세기 */
  let count = 0;
  $("counter-title").textContent = E.counter.title;
  $("counter-hint").textContent = E.counter.hint;
  const num = $("count");
  function showCount(bump) {
    num.textContent = count;
    if (bump) { num.classList.remove("bump"); void num.offsetWidth; num.classList.add("bump"); }
  }
  $("plus").addEventListener("click", () => { count += 1; showCount(true); });
  $("reset").addEventListener("click", () => { count = 0; showCount(false); });

  /* [3] 수준 탭 (기본: 저학년) */
  const tabs = { low: $("tab-low"), high: $("tab-high") };
  function setLevel(key) {
    Object.entries(tabs).forEach(([k, btn]) => {
      btn.setAttribute("aria-selected", String(k === key));
      btn.tabIndex = k === key ? 0 : -1;
    });
    $("level-body").innerHTML = E.levels[key].html;
    const more = $("level-body").querySelector("details.more summary");
    if (more) more.insertAdjacentHTML("beforeend", CHEV);
  }
  Object.entries(tabs).forEach(([k, btn]) => {
    btn.textContent = E.levels[k].label;
    btn.addEventListener("click", () => setLevel(k));
  });
  setLevel("low");

  /* [4] 생각 질문: 예측 → 해 보기 → 답 보기 */
  const Q = E.quiz;
  $("quiz-q").innerHTML = Q.question;
  $("reveal").textContent = Q.revealButton;
  let picked = null;
  const optButtons = Q.options.map((text, i) => {
    const b = document.createElement("button");
    b.innerHTML = '<span class="dot" aria-hidden="true"></span><span>' + text + "</span>";
    b.setAttribute("aria-pressed", "false");
    b.addEventListener("click", () => {
      picked = i;
      optButtons.forEach((ob, j) => ob.setAttribute("aria-pressed", String(j === i)));
      $("try").textContent = Q.tryText;
      $("try").hidden = false;
      $("reveal").disabled = false;
    });
    $("options").appendChild(b);
    return b;
  });
  $("reveal").addEventListener("click", () => {
    if (picked === null) return;
    const right = picked === Q.answerIndex;
    optButtons.forEach((b, j) => {
      b.disabled = true;
      if (j === Q.answerIndex) {
        b.classList.add("correct");
        b.insertAdjacentHTML("beforeend", '<span class="tag">정답</span>');
      }
    });
    $("answer").innerHTML =
      '<div class="verdict">' + (right ? "맞았어요! " : "아쉬워요. ") +
      "정답은 " + Q.options[Q.answerIndex] + "</div>" + Q.explain;
    $("answer").hidden = false;
    $("try").hidden = true;
    $("reveal").hidden = true;
  });

  /* [5] 자주 묻는 질문 */
  $("faq").innerHTML = E.faq
    .map((f) => "<details><summary><span>" + f.q + "</span>" + CHEV + "</summary><p>" + f.a + "</p></details>")
    .join("");
})();
</script>
</body>
</html>
