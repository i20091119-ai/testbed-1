<!--
  기본 무게추 그림 (임시)
  ─────────────────────────────────────────────
  이 파일을 원하는 그림으로 바꾸면 게임의 모든 추 그림이 한 번에 바뀝니다.
  · 정사각형(1:1) 비율로 만들어 주세요.
  · 숫자는 게임이 그림 위에 직접 그려 주므로, 가운데는 비워 두는 것이 좋습니다.
  · PNG 를 쓰고 싶다면 weight.png 로 저장한 뒤 js/game.js 맨 위 ASSETS 설정을 바꿔 주세요.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ffd9e6"/>
      <stop offset="55%" stop-color="#ff9dc0"/>
      <stop offset="100%" stop-color="#f2749f"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#fffdfe"/>
      <stop offset="100%" stop-color="#ffeef5"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.33" cy="0.25" r="0.42">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 손잡이 -->
  <path d="M34 26 A16 16 0 0 1 66 26" fill="none" stroke="#e0628f" stroke-width="9" stroke-linecap="round"/>
  <path d="M34 26 A16 16 0 0 1 66 26" fill="none" stroke="#ff9dc0" stroke-width="4.5" stroke-linecap="round"/>

  <!-- 몸통 -->
  <path d="M24 30 h52 a10 10 0 0 1 9.6 7.2 l8 42 A10 10 0 0 1 83.8 92 H16.2 A10 10 0 0 1 6.4 79.2 l8-42 A10 10 0 0 1 24 30 Z"
        fill="url(#body)" stroke="#e0628f" stroke-width="3.4" stroke-linejoin="round"/>

  <!-- 숫자가 들어갈 밝은 원 -->
  <circle cx="50" cy="63" r="24" fill="url(#face)" stroke="#f0a9c4" stroke-width="2.4"/>

  <!-- 반짝임 -->
  <ellipse cx="34" cy="43" rx="13" ry="7" fill="url(#shine)"/>
</svg>
