<!--
  경남수학문화관 로고 (임시)
  ─────────────────────────────────────────────
  실제 로고 파일로 교체해 주세요. 가로로 긴 형태(약 3:1)를 권장합니다.
  PNG 를 쓰려면 logo.png 로 저장한 뒤 js/game.js 맨 위 ASSETS.logo 를 바꿔 주세요.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100" width="300" height="100">
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#7bd0f7"/>
      <stop offset="100%" stop-color="#5a8ff0"/>
    </linearGradient>
  </defs>

  <!-- 저울 심볼 -->
  <g transform="translate(6,10)">
    <circle cx="40" cy="40" r="38" fill="url(#lg)"/>
    <rect x="37" y="30" width="6" height="34" rx="3" fill="#fff"/>
    <rect x="14" y="26" width="52" height="6" rx="3" fill="#fff" transform="rotate(-9 40 29)"/>
    <circle cx="19" cy="35" r="6.5" fill="#fff"/>
    <circle cx="61" cy="22" r="6.5" fill="#fff"/>
    <rect x="24" y="62" width="32" height="6" rx="3" fill="#fff"/>
  </g>

  <text x="96" y="46" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif"
        font-size="27" font-weight="800" fill="#2f5aa8">경남수학문화관</text>
  <!-- textLength 를 지정해 어떤 글꼴에서도 글자가 잘리지 않도록 합니다 -->
  <text x="97" y="72" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif"
        font-size="14" font-weight="600" fill="#7b93b8"
        textLength="186" lengthAdjust="spacingAndGlyphs">GYEONGNAM MATH CENTER</text>
</svg>
