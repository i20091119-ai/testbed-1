name: Deploy docent app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docent-app-hanoi/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}docent-app-hanoi/
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir -p _site/docent-app-hanoi
          cp docent-app-hanoi/index.html docent-app-hanoi/qr.png _site/docent-app-hanoi/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
